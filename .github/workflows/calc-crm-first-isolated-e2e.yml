name: Calc CRM-first isolated MySQL E2E
on:
  pull_request:
    paths:
      - '.github/workflows/calc-crm-first-isolated-e2e.yml'
      - 'scripts/office-test-crm-e2e.mjs'
      - 'database/office_test_crm_first_empty_schema.sql'
      - 'apps/api/src/**'
      - 'apps/web/src/crmDraft.tsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crm-first-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-mysql-root-password
          MYSQL_DATABASE: isolated_calc_crm_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated CRM-first Calc application
        env:
          VITE_CALC_BASE_PATH: /
        run: |
          set -euo pipefail
          npm install
          npm run typecheck
          npm run build
      - name: Create temporary self-signed localhost HTTPS mock certificate
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName=IP:127.0.0.1' \
            -keyout /tmp/calc-crm-e2e-key.pem -out /tmp/calc-crm-e2e-cert.pem >/dev/null 2>&1
      - name: Actual create, save, reopen and authorization revocation on disposable MySQL
        env:
          CALC_CRM_E2E_SCOPE: disposable-ci
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ci-only-mysql-root-password
          MYSQL_DATABASE: isolated_calc_crm_e2e
          CALC_E2E_TLS_KEY: /tmp/calc-crm-e2e-key.pem
          CALC_E2E_TLS_CERT: /tmp/calc-crm-e2e-cert.pem
        run: node scripts/office-test-crm-e2e.mjs
      - name: Scope and release state
        if: always()
        run: |
          echo "CRM_E2E_SCOPE=DISPOSABLE_CI_ONLY"
          echo "OFFICE_HOSTINGER_INSTALL=NOT_PERFORMED"
          echo "OFFICE_PRODUCTION_DATABASE=NOT_USED"
          echo "HISTORICAL_CALCULATIONS=NOT_IMPORTED"
