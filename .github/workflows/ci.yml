name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Legacy calculation truth tables must not return to runtime
        run: |
          ! grep -R --line-number --fixed-strings "calculation_versions" apps/api/src
          ! grep -R --line-number --fixed-strings "calculation_lines" apps/api/src
          ! grep -R --line-number --fixed-strings "INSERT INTO calculations" apps/api/src
